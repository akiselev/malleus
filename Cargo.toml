# malleus — differentiable, retargetable graph compiler.
#
# M1 is a faithful re-homing of solverang's jit/ (scalar opcode IR + Cranelift
# codegen). R9 adds the production boundary from Resolvent execution plans.
[package]
name = "malleus"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
description = "Differentiable retargetable graph compiler: operator/kernel IR + Cranelift JIT"
repository = "https://github.com/akiselev/malleus"
readme = "README.md"
keywords = ["jit", "compiler", "codegen", "cranelift", "ad"]
categories = ["compilers", "science"]

[features]
default = ["jit"]
jit = ["cranelift", "cranelift-jit", "cranelift-module", "cranelift-native"]
resolvent = ["jit", "dep:resolvent"]

[dependencies]
nalgebra = "0.34"
thiserror = "2.0"
# Keep the scientific compiler tuple exact. Sinbad's physics-factory branch pins
# this Malleus commit and the same merged Resolvent revision so Cargo resolves one
# semantic IR throughout the stack.
resolvent = { git = "https://github.com/akiselev/resolvent", optional = true }
cranelift = { version = "0.116", optional = true }
cranelift-jit = { version = "0.116", optional = true }
cranelift-module = { version = "0.116", optional = true }
cranelift-native = { version = "0.116", optional = true }
