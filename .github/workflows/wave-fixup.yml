name: wave-fixup

on:
  push:
    branches: [agent/r13-r20-wave-a-f]

permissions:
  contents: write

jobs:
  fixup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r13-r20-wave-a-f
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.0'
          components: rustfmt
      - run: |
          cargo fmt --all
          git rm .github/workflows/wave-fixup.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u
          git commit -m 'Apply final rustfmt to Wave kernel changes'
          git push origin HEAD:agent/r13-r20-wave-a-f
