[package]
name = "malleus-cranelift"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
description = "Optional Cranelift JIT backend for Malleus executables (native code; not a dependency of malleus)"
publish = false

[dependencies]
malleus = { path = "../.." }
cranelift-codegen = "=0.128.3"
cranelift-frontend = "=0.128.3"
cranelift-module = "=0.128.3"
cranelift-jit = "=0.128.3"
cranelift-native = "=0.128.3"
serde_json = "1"
thiserror = "2"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
